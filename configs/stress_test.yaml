# ensemble tried, never below.
experiment: construction_stress_test
qubit_dim: 2
n_pairs: 30000
ensembles: [digitizing, ry_rotation, mub_two_basis, sic_povm, haar_montecarlo]
output_json: data/processed/stress_test.json
output_table: tables/table_stress_test.md
