# Experiment A: block-size exponent sweep (Section 7.2)
experiment: exponent_sweep
block_sizes: [2, 3, 4, 5, 6]        # b=1 handled separately -- see b1_structural below
depth: 32                            # raised from 8 after Section 7.1's design-assumption check
n_pairs: 20000                       # samples per (block, seed); paper used 40k-1M, cost-driven
seeds_per_block: {2: 3, 3: 3, 4: 2, 5: 1, 6: 1}
domain: [-3.14159265358979, 3.14159265358979]
purity_check_samples: 4000
run_regression_crosscheck: true      # Method 2 -- flagged fragile, see Section 7.6
regression_block_repeats: [1, 2, 3, 4]   # simulate this many i.i.d. copies of the block, fit slope
output_json: data/processed/expA.json
output_table: tables/table_experiment_A.md

b1_structural:
  # b=1 cannot test the c(1) ceiling (Corollary 1.2, measure-zero-curve argument).
  # Handled with two analytically-known-correct constructions instead.
  ry_only_depth: 1                   # bare RX(x) product embedding, matches Thanasilp Prop. 1
  n_pairs: 20000
  digitizing_bins: 2                 # D=2 computational-basis digitizing check
